# Common settings
proj_name: enf_torch_elasticity
seed: 42
logging:
    log_dir: './experiments/training/'
    save_predictions: true

dataset:
  name: 'elasticity'  # or 'rae_transonic'
  root_path: '/scratch/dmsm/gi.catalani/Elasticity/'  # adjust path as needed
  test_latents_path: /home/dmsm/gi.catalani/Projects/enf-torch/enf-torch-main/elasticity/experiments/training/2025-06-20_13-43-21/modulations/val_modulations.pt
  train_latents_path: /home/dmsm/gi.catalani/Projects/enf-torch/enf-torch-main/elasticity/experiments/training/2025-06-20_13-43-21/modulations/train_modulations.pt
  task: 
  num_points: 
  augmented_inputs: true # Set to 'true' if you want to use augmented input data

model:
  num_hidden: 256
  num_heads: 2
  num_layers: 2
  num_out: 1
  latent_dim: 8
  gaussian_window: 0.5
  num_latents: 4
  in_dim: 4
  spatial_dim: 2
  embedding_type: 'rff'
  emb_freq_q: 0.2
  emb_freq_v: 0.2
  condition_value_transform: true
  freeze_lat_pos: true
  use_enhanced_stem: true
  use_lightweight_self_attn: true
  latent_bbox: null  # Set this to the bounding box of your dataset
  checkpoint_directory: null

optimizer:
  learning_rate_enf: 0.0001
  learning_rate_codes: 0.0

train: 
    device: 'cuda'

optim: 
  batch_size: 4
  epochs: 2000
  inner_steps: 
  num_points: 
  lr_enf: 0.0005
  lr_latents: 